services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatekeeper
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper -d gatekeeper"]
      interval: 3s
      timeout: 3s
      retries: 10

  dummy-backend:
    image: kennethreitz/httpbin
    ports: ["8081:80"]

  gatekeeper:
    build: .
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      dummy-backend:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gatekeeper
      SPRING_DATASOURCE_USERNAME: gatekeeper
      SPRING_DATASOURCE_PASSWORD: gatekeeper
      SPRING_DATA_REDIS_HOST: redis
      GATEKEEPER_BACKEND_URL: http://dummy-backend:80
